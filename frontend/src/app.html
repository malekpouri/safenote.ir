<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="keywords" content="secure note, encrypted note, self-destruct note, one-time secret, safenote, یادداشت امن, یادداشت رمزنگاری شده, یادداشت خود تخریب گر" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="SafeNote" />
		<meta property="og:url" content="https://www.safenote.ir/" />
		<meta property="og:image" content="https://www.safenote.ir/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://www.safenote.ir/og-image.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
